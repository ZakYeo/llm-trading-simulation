services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_trading_simulation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d llm_trading_simulation']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/llm_trading_simulation?schema=public
      PORT: 3000
      AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_AGENT_SYSTEM_PROMPT: ${OPENAI_AGENT_SYSTEM_PROMPT:-}
      OPENAI_AGENT_STRICT_MODE: ${OPENAI_AGENT_STRICT_MODE:-0}
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '5173:5173'

volumes:
  postgres-data:
